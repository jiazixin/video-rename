# 复制为 configs/config.local.yaml 后编辑。相对路径以配置文件所在目录为基准。
listen: "127.0.0.1"                    # 局域网访问可改为 0.0.0.0
port: 8080
media_dir:                             # 至少一个已存在的媒体目录，各目录不能重叠
  - "/srv/videos"
  # - "/mnt/nas/videos"
data_dir: "data"                       # 本机持久数据，包含 data.sqlite 及密钥
cache_dir: "cache"                     # 截图缓存，须位于所有媒体目录之外

auth:
  username: "admin"
  password: "请替换为你的密码"

# 模型、抽帧规则和图片参数在 Web 页面设置。
log:
  level: "info"                        # debug、info、warn 或 error
  format: "json"                       # json 或 text
  file: ""                             # 留空输出到 stdout；例如 "data/logs/service.log"
