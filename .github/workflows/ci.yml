name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit; the comment names the reviewed tag.
jobs:
  web:
    name: Web 格式、类型与构建
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix web run format:check
      - run: npm --prefix web run lint
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run test
      - run: npm --prefix web run build
      - run: npm --prefix web audit --audit-level=high --omit=dev

  go:
    name: Go 检查与测试
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: 安装 FFmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
      # The Go embed package needs web/dist before any vet, test or build.
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix web run build
      - run: go mod verify
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          [ -z "$unformatted" ] || { echo "$unformatted"; exit 1; }
      - run: go vet ./...
      # macOS is cross-checked only; release-snapshot also cross-compiles it.
      - run: GOOS=darwin GOARCH=arm64 go vet ./...
      - run: go test -race -count=1 ./...
      - run: go mod tidy -diff
      - name: goimports
        run: |
          unformatted=$(go run golang.org/x/tools/cmd/goimports@v0.50.0 -local video-rename -l $(git ls-files '*.go'))
          [ -z "$unformatted" ] || { echo "$unformatted"; exit 1; }
      - run: go vet -tags integration,scale ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # Real FFmpeg extraction and real `go build` version stamping.
      - run: go test -tags=integration -count=1 ./internal/media ./cmd/video-rename

  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The fixture server synthesizes MPEG-4 and VP8 clips with FFmpeg.
      - name: 安装 FFmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends ffmpeg
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix web run build
      # web/e2e/server.mjs starts ../bin/video-rename on port 18790.
      - run: go build -trimpath -o bin/video-rename ./cmd/video-rename
      - name: 安装 Chromium
        working-directory: web
        run: npm exec -- playwright install --with-deps chromium
      - run: npm --prefix web run test:e2e
      - name: 上传失败截图与 trace
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: web/test-results/
          retention-days: 7

  release-snapshot:
    name: GoReleaser 多目标快照构建
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          install-only: true
      - run: goreleaser check
      - run: goreleaser release --snapshot --clean
